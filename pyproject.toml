[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-tts"
version = "0.1.0.dev0"
description = "Reference-conditioned AdaSpeech synthesis with selectable BigVGAN vocoders"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "PyYAML>=6,<7"]
dynamic = ["optional-dependencies"]

[project.scripts]
adversarial-tts = "tts.cli:main"

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE.md", "vocoder/LICENSE", "vocoder/incl_licenses/*", "acoustic/hifigan/LICENSE"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tts*", "acoustic*", "vocoder*"]
exclude = ["*.tests*", "*.docs*", "*.requirements*", "*.incl_licenses*"]
namespaces = true

[tool.setuptools.package-data]
acoustic = ["config/**/*.yaml", "config/*.txt", "config.json", "lexicon/*.dict", "G2P/*.json", "G2P/*.txt", "hifigan/*.json", "hifigan/LICENSE", "hifigan/16k/*.yaml", "model/*.yaml", "requirements.txt"]
vocoder = ["configs/*.json", "configs/*.yaml", "configs/*.conf", "LICENSE", "incl_licenses/*", "requirements/*.txt"]

[tool.setuptools.dynamic.optional-dependencies]
acoustic = {file = ["requirements/acoustic-inference.txt"]}
vocoder = {file = ["vocoder/requirements/inference.txt"]}
speaker-encoder = {file = ["requirements/speaker-encoder.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
include = ["inference.py", "tts/*.py", "acoustic/predict.py", "acoustic/frontend.py", "scripts/*.py", "tests/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
